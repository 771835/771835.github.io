<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dovetail Online IDE</title>
    <style>
        /* ========== CSS 变量 ========== */
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #323233;
            --border: #444;
            --text-primary: #d4d4d4;
            --text-secondary: #888;
            --text-muted: #555;
            --accent: #0e639c;
            --accent-hover: #1177bb;
            --success: #6a9955;
            --error: #f44747;
            --warning: #cca700;
            --info: #3794ff;
        }

        /* ========== Reset ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ========== 顶栏 ========== */
        #toolbar {
            height: 42px;
            min-height: 42px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        #toolbar .logo {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            margin-right: 8px;
            user-select: none;
        }

        #toolbar .logo span {
            color: var(--accent);
        }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 4px;
        }

        #toolbar button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 4px 16px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s;
        }

        #toolbar button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        #toolbar button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        #toolbar button.secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        #toolbar button.secondary:hover:not(:disabled) {
            background: var(--bg-secondary);
        }

        #toolbar select {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }

        #toolbar label {
            font-size: 12px;
            color: var(--text-secondary);
            user-select: none;
        }

        #toolbar .spacer {
            flex: 1;
        }

        #loading-status {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }

        /* ========== 主体 ========== */
        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 拖拽分割条 */
        .resizer {
            width: 4px;
            cursor: col-resize;
            background: var(--border);
            z-index: 10;
            transition: background 0.15s;
        }

        .resizer:hover, .resizer.active {
            background: var(--accent);
        }

        /* ========== 左侧：编辑器 ========== */
        #editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 200px;
        }

        #editor-tab-bar {
            height: 32px;
            min-height: 32px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            padding: 0 8px;
            border-bottom: 1px solid var(--border);
        }

        .editor-tab {
            padding: 4px 12px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            border-bottom: 2px solid var(--accent);
            user-select: none;
        }

        #editor-container {
            flex: 1;
            position: relative;
        }

        /* ========== 右侧：输出面板 ========== */
        #output-pane {
            width: 50%;
            display: flex;
            flex-direction: column;
            min-width: 200px;
        }

        #output-tabs {
            height: 32px;
            min-height: 32px;
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            align-items: flex-end;
            overflow-x: auto;
        }

        .tab {
            padding: 5px 14px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            user-select: none;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: color 0.15s, border-color 0.15s;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }

        .tab-badge {
            display: inline-block;
            background: var(--error);
            color: #fff;
            font-size: 10px;
            padding: 0 5px;
            border-radius: 8px;
            margin-left: 5px;
            line-height: 16px;
            vertical-align: middle;
        }

        .tab-badge.success {
            background: var(--success);
        }

        #output-content {
            flex: 1;
            overflow: auto;
            padding: 10px 12px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 日志样式 */
        .log-line {
            color: var(--text-secondary);
        }

        .log-line.info {
            color: var(--info);
        }

        .log-line.warning {
            color: var(--warning);
        }

        .log-line.error {
            color: var(--error);
        }

        .log-line.success {
            color: var(--success);
        }

        .log-line.debug {
            color: var(--text-muted);
        }

        .compile-status {
            font-weight: 600;
            padding: 6px 0;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .compile-status.success {
            color: var(--success);
        }

        .compile-status.failure {
            color: var(--error);
        }

        /* 文件树 */
        .file-tree {
            list-style: none;
            padding: 0;
        }

        .file-tree ul {
            list-style: none;
            padding-left: 18px;
        }

        .file-tree li {
            padding: 3px 0;
            cursor: pointer;
            font-size: 13px;
            transition: color 0.1s;
        }

        .file-tree li:hover {
            color: #fff;
        }

        .file-tree .dir {
            color: #dcb67a;
        }

        .file-tree .file-mcfunction {
            color: #9cdcfe;
        }

        .file-tree .file-json {
            color: #ce9178;
        }

        .file-tree .file-default {
            color: var(--text-primary);
        }

        .file-icon {
            margin-right: 6px;
            font-size: 12px;
        }

        /* 文件内容查看 */
        .file-viewer-header {
            padding: 6px 0;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-viewer-header .filepath {
            color: #569cd6;
            font-weight: 600;
        }

        .file-viewer-header .close-btn {
            background: var(--text-muted);
            color: #fff;
            border: none;
            padding: 2px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            margin-left: auto;
        }

        .file-viewer-header .close-btn:hover {
            background: var(--accent);
        }

        /* 加载遮罩 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 30, 30, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .loading-detail {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .loading-progress {
            margin-top: 12px;
            width: 240px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s;
        }

        /* 快捷键提示 */
        .kbd {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
        }
    </style>
</head>
<body>

<!-- ========== 加载遮罩 ========== -->
<div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">正在加载 Dovetail Online IDE</div>
    <div class="loading-detail" id="loading-detail">初始化 Pyodide 运行时...</div>
    <div class="loading-progress">
        <div class="loading-progress-bar" id="loading-bar" style="width: 0%"></div>
    </div>
</div>

<!-- ========== 顶栏 ========== -->
<div id="toolbar">
    <div class="logo"><span>&gt;</span> Dovetail</div>

    <div class="toolbar-sep"></div>

    <button id="run-btn" disabled>
        ▶ 编译 <span class="kbd" style="margin-left:4px;">Ctrl+↵</span>
    </button>

    <div class="toolbar-sep"></div>

    <label>MC</label>
    <select id="mc-version">
        <option value="1.21.5">1.21.5</option>
        <option value="1.21.4">1.21.4</option>
        <option value="1.21.2">1.21.2</option>
        <option value="1.21">1.21</option>
        <option value="1.20.6">1.20.6</option>
        <option value="1.20.4">1.20.4</option>
    </select>

    <label>优化</label>
    <select id="opt-level">
        <option value="0">O0</option>
        <option value="1">O1</option>
        <option value="2" selected>O2</option>
        <option value="3">O3</option>
    </select>

    <div class="toolbar-sep"></div>

    <button id="download-btn" disabled class="secondary">⬇ 下载数据包</button>

    <div class="spacer"></div>

    <span id="loading-status">⏳ 加载中</span>
</div>

<!-- ========== 主体 ========== -->
<div id="main">
    <!-- 左：编辑器 -->
    <div id="editor-pane">
        <div id="editor-tab-bar">
            <div class="editor-tab">📄 input.mcdl</div>
        </div>
        <div id="editor-container"></div>
    </div>

    <!-- 分割条 -->
    <div class="resizer" id="resizer"></div>

    <!-- 右：输出 -->
    <div id="output-pane">
        <div id="output-tabs">
            <div class="tab active" data-tab="log">编译日志</div>
            <div class="tab" data-tab="files">输出文件</div>
        </div>
        <div id="output-content">
            <div class="log-line">等待编译...</div>
        </div>
    </div>
</div>

<!-- ========== CDN 依赖 ========== -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

<script>
    // ============================================================
    // 全局状态
    // ============================================================
    let pyodide = null;
    let editor = null;
    let lastOutputFiles = {};
    let currentTab = 'log';
    let currentFileView = null;       // 当前查看的文件路径
    let compileTimer = null;          // 编译计时器
    let isCompiling = false;

    // ============================================================
    // 加载进度 UI
    // ============================================================
    function setLoadProgress(percent, text, detail) {
        document.getElementById('loading-bar').style.width = percent + '%';
        if (text) document.getElementById('loading-text').textContent = text;
        if (detail) document.getElementById('loading-detail').textContent = detail;
    }

    function hideLoadOverlay() {
        document.getElementById('loading-overlay').classList.add('hidden');
    }

    // ============================================================
    // 初始化 Monaco Editor
    // ============================================================
    require.config({
        paths: {vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs'}
    });

    require(['vs/editor/editor.main'], async function (monaco) {
        // 注册 .mcdl 语言
        monaco.languages.register({id: 'mcdl'});
        monaco.languages.setMonarchTokensProvider('mcdl', {
            keywords: [
                'fn', 'let', 'var', 'const', 'if', 'else', 'while', 'for',
                'return', 'break', 'continue', 'struct', 'enum', 'include',
                'typedef', 'interface', 'impl', 'new', 'as', 'is',
            ],
            typeKeywords: [
                'int', 'float', 'bool', 'string', 'void', 'list', 'dict',
                'true', 'false', 'null',
            ],
            operators: [
                '=', '>', '<', '!', '~', '?', ':',
                '==', '<=', '>=', '!=', '&&', '||',
                '+', '-', '*', '/', '%', '&', '|', '^', '<<', '>>',
                '+=', '-=', '*=', '/=',
            ],
            symbols: /[=><!~?:&|+\-*/^%]+/,
            tokenizer: {
                root: [
                    // 注解
                    [/@\w+/, 'annotation'],

                    // 注释
                    [/#.*$/, 'comment'],

                    // f-string
                    [/f"/, 'string', '@fstring_double'],
                    [/f'/, 'string', '@fstring_single'],

                    // 普通字符串
                    [/"([^"\\]|\\.)*$/, 'string.invalid'],
                    [/"/, 'string', '@string_double'],
                    [/'([^'\\]|\\.)*$/, 'string.invalid'],
                    [/'/, 'string', '@string_single'],

                    // 数字
                    [/\d*\.\d+([eE][+-]?\d+)?/, 'number.float'],
                    [/0[xX][0-9a-fA-F]+/, 'number.hex'],
                    [/\d+/, 'number'],

                    // 关键字
                    [/[a-zA-Z_]\w*/, {
                        cases: {
                            '@keywords': 'keyword',
                            '@typeKeywords': 'keyword.type',
                            '@default': 'identifier',
                        }
                    }],

                    // 分隔符
                    [/[{}()\[\]]/, '@brackets'],
                    [/[,;]/, 'delimiter'],

                    // 运算符
                    [/@symbols/, {
                        cases: {
                            '@operators': 'operator',
                            '@default': '',
                        }
                    }],
                ],

                string_double: [
                    [/[^\\"]+/, 'string'],
                    [/\\./, 'string.escape'],
                    [/"/, 'string', '@pop'],
                ],
                string_single: [
                    [/[^\\']+/, 'string'],
                    [/\\./, 'string.escape'],
                    [/'/, 'string', '@pop'],
                ],
                fstring_double: [
                    [/\{/, 'delimiter.bracket', '@fstring_expr'],
                    [/[^\\{"]+/, 'string'],
                    [/\\./, 'string.escape'],
                    [/"/, 'string', '@pop'],
                ],
                fstring_single: [
                    [/\{/, 'delimiter.bracket', '@fstring_expr'],
                    [/[^\\{']+/, 'string'],
                    [/\\./, 'string.escape'],
                    [/'/, 'string', '@pop'],
                ],
                fstring_expr: [
                    [/\}/, 'delimiter.bracket', '@pop'],
                    [/[^}]+/, 'identifier'],
                ],
            },
        });

        // 定义主题色
        monaco.editor.defineTheme('mcdl-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
                {token: 'annotation', foreground: '4EC9B0', fontStyle: 'italic'},
                {token: 'keyword.type', foreground: '4EC9B0'},
                {token: 'number.hex', foreground: 'B5CEA8'},
                {token: 'string.escape', foreground: 'D7BA7D'},
                {token: 'delimiter.bracket', foreground: 'FFD700'},
            ],
            colors: {},
        });

        // 创建编辑器
        editor = monaco.editor.create(document.getElementById('editor-container'), {
            value: "@init\nfn main()\n{\n\tprint(\"Hello World!\")\n}\n",
            language: 'mcdl',
            theme: 'mcdl-dark',
            minimap: {enabled: false},
            fontSize: 14,
            lineNumbers: 'on',
            scrollBeyondLastLine: false,
            automaticLayout: true,
            tabSize: 4,
            insertSpaces: true,
            wordWrap: 'on',
            folding: true,
            bracketPairColorization: {enabled: true},
            padding: {top: 8},
        });

        // 快捷键：Ctrl+Enter 编译
        editor.addCommand(
            monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
            () => runCompile()
        );

        // 初始化 Pyodide
        await initPyodide();
    });

    // ============================================================
    // 初始化 Pyodide
    // ============================================================
    async function initPyodide() {
        try {
            // 阶段 1: 加载 Pyodide 运行时
            setLoadProgress(5, '正在加载 Dovetail Online IDE', '下载 Pyodide 运行时 (~20MB)...');

            pyodide = await loadPyodide({
                indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.1/full/'
            });
            setLoadProgress(40, '正在加载 Dovetail Online IDE', 'Pyodide 运行时已就绪');

            // 阶段 2: 安装依赖
            setLoadProgress(45, '正在加载 Dovetail Online IDE', '安装 Python 依赖...');
            await pyodide.loadPackage('micropip');
            const micropip = pyodide.pyimport('micropip');

            setLoadProgress(55, '正在加载 Dovetail Online IDE', '安装 lark...');
            await micropip.install('lark');

            setLoadProgress(65, '正在加载 Dovetail Online IDE', '安装 attrs...');
            await micropip.install('attrs');

            // 阶段 3: 加载项目包
            setLoadProgress(75, '正在加载 Dovetail Online IDE', '下载 Dovetail 编译器...');

            const resp = await fetch('dovetail-pkg.tar.gz');
            if (!resp.ok) {
                throw new Error(`dovetail-pkg.tar.gz 加载失败 (HTTP ${resp.status})，请确保文件已部署到同一目录`);
            }
            const buf = await resp.arrayBuffer();
            setLoadProgress(85, '正在加载 Dovetail Online IDE', '解压编译器到虚拟文件系统...');
            pyodide.unpackArchive(buf, 'gztar', {extractDir: '/dovetail-project'});

            // 阶段 4: 预热编译器
            setLoadProgress(90, '正在加载 Dovetail Online IDE', '预热编译器 (首次较慢)...');

            pyodide.runPython(`
import sys
sys.path.insert(0, '/dovetail-project')
      `);

            pyodide.runPython('from bridge import compile_online, pack_output_zip, get_version_info');

            // 获取版本信息
            const versionInfo = JSON.parse(pyodide.runPython('import json; json.dumps(get_version_info())'));
            console.log('Dovetail version:', versionInfo);

            // 预热编译：跑一次空编译消除懒加载开销
            setLoadProgress(95, '正在加载 Dovetail Online IDE', '预热完成');
            pyodide.runPython(`
import json
json.dumps(compile_online("fn main() { say(1); }", namespace="__warmup__"))
      `);

            // 阶段 5: 就绪
            setLoadProgress(100, 'Dovetail Online IDE', '就绪');

            // 启用 UI
            document.getElementById('run-btn').disabled = false;
            const status = document.getElementById('loading-status');
            status.textContent = `✅ ${versionInfo.name} v${versionInfo.version} 就绪`;
            status.style.color = 'var(--success)';

            // 延迟隐藏遮罩
            setTimeout(hideLoadOverlay, 300);

        } catch (e) {
            setLoadProgress(0, '加载失败', e.message);
            document.getElementById('loading-text').style.color = 'var(--error)';
            document.getElementById('loading-detail').textContent = e.message;
            document.getElementById('loading-bar').style.background = 'var(--error)';
            // 不隐藏遮罩，让用户看到错误
            console.error('Pyodide init failed:', e);
        }
    }

    // ============================================================
    // 编译
    // ============================================================
    async function runCompile() {
        if (isCompiling || !pyodide) return;
        isCompiling = true;

        const btn = document.getElementById('run-btn');
        btn.disabled = true;
        btn.innerHTML = '⏳ 编译中...';

        const code = editor.getValue();
        const mcVersion = document.getElementById('mc-version').value;
        const optLevel = parseInt(document.getElementById('opt-level').value);

        const startTime = performance.now();

        try {
            // 调用 Python bridge
            // 用 pyodide.globals 传参，避免双重序列化
            pyodide.globals.set("_user_code", code);
            const resultJson = pyodide.runPython(`
import json
json.dumps(compile_online(
    _user_code,
    namespace="demo",
    mc_version=${JSON.stringify(mcVersion)},
    opt_level=${optLevel},
    debug=False,
))
      `);
            const result = JSON.parse(resultJson);
            const elapsed = ((performance.now() - startTime) / 1000).toFixed(3);

            // 渲染日志
            currentFileView = null;
            showTab('log');
            const output = document.getElementById('output-content');
            output.innerHTML = '';

            // 状态行
            if (result.success) {
                output.innerHTML += `<div class="compile-status success">✅ 编译成功 (${elapsed}s)</div>`;
            } else {
                output.innerHTML += `<div class="compile-status failure">❌ 编译失败 (${elapsed}s)</div>`;
            }

            // 日志
            if (result.log) {
                for (const line of result.log.split('\n')) {
                    if (!line.trim()) continue;
                    const cls = classifyLogLine(line);
                    output.innerHTML += `<div class="log-line ${cls}">${escapeHtml(line)}</div>`;
                }
            }

            // 错误
            if (result.errors && result.errors.length > 0) {
                for (const err of result.errors) {
                    output.innerHTML += `<div class="log-line error">${escapeHtml(err)}</div>`;
                }
            }

            // 更新输出文件
            lastOutputFiles = result.output_files || {};
            updateFileTabBadge();

            // 下载按钮
            document.getElementById('download-btn').disabled = !result.success || Object.keys(lastOutputFiles).length === 0;

        } catch (e) {
            const output = document.getElementById('output-content');
            output.innerHTML = `<div class="compile-status failure">❌ 运行时错误</div>`;
            output.innerHTML += `<div class="log-line error">${escapeHtml(e.message)}</div>`;
            console.error('Compile error:', e);
        }

        btn.disabled = false;
        btn.innerHTML = '▶ 编译 <span class="kbd" style="margin-left:4px;">Ctrl+↵</span>';
        isCompiling = false;
    }

    function classifyLogLine(line) {
        const l = line.toLowerCase();
        if (l.includes('error') || l.includes('错误') || l.includes('critical')) return 'error';
        if (l.includes('warning') || l.includes('警告') || l.includes('warn')) return 'warning';
        if (l.includes('info') || l.includes('信息')) return 'info';
        if (l.includes('success') || l.includes('成功') || l.includes('完成')) return 'success';
        if (l.includes('debug') || l.includes('调试')) return 'debug';
        return '';
    }

    // ============================================================
    // Tab 切换
    // ============================================================
    document.querySelectorAll('#output-tabs .tab').forEach(tab => {
        tab.addEventListener('click', () => showTab(tab.dataset.tab));
    });

    function showTab(name) {
        currentTab = name;
        document.querySelectorAll('#output-tabs .tab').forEach(t =>
            t.classList.toggle('active', t.dataset.tab === name)
        );
        const output = document.getElementById('output-content');

        if (name === 'files') {
            renderFileTree();
        } else if (name === 'log') {
            // 切换到 'log' 标签时，清空当前文件视图并显示编译日志
            currentFileView = null;
            const logContent = document.querySelector('.compile-status')?.outerHTML || '';
            const logLines = document.querySelectorAll('.log-line');
            let logHtml = logContent;
            logLines.forEach(line => {
                logHtml += line.outerHTML;
            });
            output.innerHTML = logHtml;
        }
    }

    function updateFileTabBadge() {
        const filesTab = document.querySelector('.tab[data-tab="files"]');
        // 移除旧 badge
        const oldBadge = filesTab.querySelector('.tab-badge');
        if (oldBadge) oldBadge.remove();

        const count = Object.keys(lastOutputFiles).length;
        if (count > 0) {
            const badge = document.createElement('span');
            badge.className = 'tab-badge success';
            badge.textContent = count;
            filesTab.appendChild(badge);
        }
    }

    // ============================================================
    // 文件树渲染
    // ============================================================
    function renderFileTree() {
        const output = document.getElementById('output-content');
        const files = lastOutputFiles;

        if (Object.keys(files).length === 0) {
            output.innerHTML = '<div class="log-line" style="padding:20px;">尚无输出文件，请先编译代码</div>';
            return;
        }

        if (currentFileView) {
            renderFileContent(currentFileView);
            return;
        }

        // 构建树结构
        const tree = {};
        for (const path of Object.keys(files)) {
            const parts = path.split('/');
            let node = tree;
            for (let i = 0; i < parts.length - 1; i++) {
                if (!node[parts[i]]) node[parts[i]] = {};
                node = node[parts[i]];
            }
            node[parts[parts.length - 1]] = null; // null = 文件
        }

        output.innerHTML = '';
        const ul = document.createElement('ul');
        ul.className = 'file-tree';
        renderTreeNode(tree, ul, '');
        output.appendChild(ul);
    }

    function renderTreeNode(node, parentUl, prefix) {
        // 先目录后文件
        const entries = Object.entries(node).sort(([ka, va], [kb, vb]) => {
            const aIsDir = va !== null;
            const bIsDir = vb !== null;
            if (aIsDir !== bIsDir) return aIsDir ? -1 : 1;
            return ka.localeCompare(kb);
        });

        for (const [name, value] of entries) {
            const li = document.createElement('li');
            const fullPath = prefix ? prefix + '/' + name : name;

            if (value !== null) {
                // 目录
                li.className = 'dir';
                li.innerHTML = `<span class="file-icon">📁</span>${escapeHtml(name)}`;
                const childUl = document.createElement('ul');
                childUl.style.display = 'none';
                li.appendChild(childUl);
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    childUl.style.display = childUl.style.display === 'none' ? 'block' : 'none';
                    const icon = li.querySelector('.file-icon');
                    icon.textContent = childUl.style.display === 'none' ? '📁' : '📂';
                });
                renderTreeNode(value, childUl, fullPath);
            } else {
                // 文件
                const ext = name.split('.').pop();
                li.className = getFileClass(ext);
                const icon = getFileIcon(ext);
                li.innerHTML = `<span class="file-icon">${icon}</span>${escapeHtml(name)}`;
                li.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentFileView = fullPath;
                    renderFileContent(fullPath);
                });
            }

            parentUl.appendChild(li);
        }
    }

    function getFileClass(ext) {
        if (ext === 'mcfunction') return 'file-mcfunction';
        if (ext === 'json') return 'file-json';
        return 'file-default';
    }

    function getFileIcon(ext) {
        const icons = {
            'mcfunction': '⚡',
            'json': '📋',
            'mcmeta': '📋',
            'png': '🖼️',
        };
        return icons[ext] || '📄';
    }

    function renderFileContent(path) {
        const output = document.getElementById('output-content');
        const content = lastOutputFiles[path];
        if (!content) return;

        const isBinary = content.startsWith('base64:');
        const displayContent = isBinary ? '[二进制文件，无法预览]' : content;
        const ext = path.split('.').pop();

        output.innerHTML = `
      <div class="file-viewer-header">
        <span class="filepath">${getFileIcon(ext)} ${escapeHtml(path)}</span>
        <button class="close-btn" onclick="closeFileView()">✕ 关闭</button>
      </div>
      <pre style="margin:0;white-space:pre-wrap;tab-size:4;">${escapeHtml(displayContent)}</pre>
    `;
    }

    window.closeFileView = function () {
        currentFileView = null;
        if (currentTab === 'files') {
            renderFileTree();
        }
    };

    // ============================================================
    // 下载数据包
    // ============================================================
    document.getElementById('download-btn').addEventListener('click', () => {
        if (!pyodide) return;

        try {
            const zipBase64 = pyodide.runPython('pack_output_zip()');
            const binary = atob(zipBase64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const blob = new Blob([bytes], {type: 'application/zip'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'datapack.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (e) {
            alert('下载失败: ' + e.message);
            console.error('Download error:', e);
        }
    });

    // ============================================================
    // 编译按钮绑定
    // ============================================================
    document.getElementById('run-btn').addEventListener('click', () => runCompile());

    // ============================================================
    // 拖拽分割条
    // ============================================================
    (function initResizer() {
        const resizer = document.getElementById('resizer');
        const editorPane = document.getElementById('editor-pane');
        const outputPane = document.getElementById('output-pane');
        const main = document.getElementById('main');

        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const rect = main.getBoundingClientRect();
            const totalWidth = rect.width;
            const editorWidth = e.clientX - rect.left;
            const percent = Math.max(20, Math.min(80, (editorWidth / totalWidth) * 100));

            editorPane.style.flex = 'none';
            editorPane.style.width = percent + '%';
            outputPane.style.width = (100 - percent) + '%';
        });

        document.addEventListener('mouseup', () => {
            if (!isResizing) return;
            isResizing = false;
            resizer.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });
    })();

    // ============================================================
    // 工具函数
    // ============================================================
    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
</script>
</body>
